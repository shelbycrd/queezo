<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315b45">
  <title>Queezo · Study companion</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pomodoro.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#dashboard" aria-label="Queezo dashboard"><span class="brand-mark">Q</span>Queezo</a>
    <nav id="main-navigation" aria-label="Main navigation" hidden>
      <a href="#dashboard" data-nav="dashboard">Apps</a>
      <a href="#decks" data-nav="decks">Flashcards</a>
      <a href="#gwa" data-nav="gwa">GWA Calculator</a>
      <a href="#pomodoro" data-nav="pomodoro">Pomodoro</a>
    </nav>
    <div id="account-controls" class="account-controls" hidden><span id="account-email"></span><button id="logout" type="button" class="secondary small">Log out</button></div>
  </header>
  <div id="notice" class="notice" role="alert" hidden></div>
  <aside id="pomodoro-alert" class="pomodoro-alert" aria-label="Pomodoro notification" hidden><div role="status" aria-live="polite"><strong></strong><p></p></div><div class="actions"><a href="#pomodoro">Open timer</a><button id="dismiss-pomodoro-alert" type="button" class="secondary small" aria-label="Dismiss timer notification">Dismiss</button></div></aside>
  <main id="app" tabindex="-1"><p class="muted">Loading Queezo…</p></main>
  <footer>Queezo · A little recall, a little progress.</footer>
</body>
</html>
