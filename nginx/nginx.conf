log_format queezo_safe '$status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=queezo_clients:1m rate=60r/s;

server {
    access_log /var/log/nginx/access.log queezo_safe;
    # Request-scoped Nginx errors may include credential-bearing URLs.
    error_log /dev/null crit;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;
    include /etc/nginx/queezo-security-headers.conf;

    location /api/gwa/ {
        limit_req zone=queezo_clients burst=120 nodelay;
        limit_req_status 429;
        include /etc/nginx/queezo-security-headers.conf;
        proxy_pass http://gwa:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    # The old `/gwa` page path would otherwise be redirected into the GWA API prefix below.
    location = /gwa {
        include /etc/nginx/queezo-security-headers.conf;
        # Relative Location keeps the browser's scheme, host, and published port.
        absolute_redirect off;
        return 301 /gwa-calculator$is_args$args;
    }
    location /gwa/ {
        include /etc/nginx/queezo-security-headers.conf;
        proxy_pass http://gwa:8000;
        proxy_set_header Host $http_host;
    }
    location ~ ^/api/rooms/[^/]+/live$ {
        limit_req zone=queezo_clients burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=queezo_clients burst=120 nodelay;
        limit_req_status 429;
        include /etc/nginx/queezo-security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        include /etc/nginx/queezo-security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }
    location / {
        include /etc/nginx/queezo-security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
