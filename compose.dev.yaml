services:
  backend:
    environment:
      AUTH_TRUSTED_ORIGINS: "${AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080},http://localhost:5173,http://127.0.0.1:5173"
  gwa:
    environment:
      AUTH_TRUSTED_ORIGINS: "${AUTH_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080},http://localhost:5173,http://127.0.0.1:5173"
  frontend-dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      QUEEZO_PROXY_TARGET: http://frontend:80
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  frontend_dev_node_modules:
