services:
  backend:
    volumes:
      - queezo_backup_status:/backup-status:ro
  backup:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backup
    env_file:
      - path: .env.backup
        required: false
    environment:
      DATABASE_URL: sqlite:////data/queezo.db
      BACKUP_DIRECTORY: /backups
      BACKUP_STATUS_DIRECTORY: /backup-status
    volumes:
      - queezo_data:/data:ro
      - queezo_backups:/backups
      - queezo_backup_status:/backup-status
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  queezo_backups:
  queezo_backup_status:
